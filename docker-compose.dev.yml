name: devhub-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: devhub_dev
    ports:
      - '5434:5432'
    volumes:
      - devhub-dev-db:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d devhub_dev']
      interval: 2s
      timeout: 5s
      retries: 20

  redis-dev:
    image: redis:7-alpine
    ports:
      - '6381:6379'
    volumes:
      - devhub-dev-redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: quay.io/minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9010:9000'
      - '9011:9001'
    volumes:
      - devhub-dev-object-store:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 2s
      timeout: 5s
      retries: 20

  minio-init:
    profiles: ['init']
    image: quay.io/minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - >
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/devhub-dev &&
        mc anonymous set download local/devhub-dev

volumes:
  devhub-dev-db:
  devhub-dev-redis:
  devhub-dev-object-store:
